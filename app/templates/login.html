{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="panel" style="max-width:420px; margin:40px auto;">
  <h1>Iniciar sesión</h1>
  <p class="suave">Ingrese con el correo y la contraseña que le entregó el área de soporte.</p>
  <form method="post">
    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" name="correo" value="{{ correo }}" required>
    <label for="contrasena">Contraseña</label>
    <input type="password" id="contrasena" name="contrasena" required>
    <p><button type="submit">Ingresar</button></p>
  </form>
</div>
{% endblock %}
